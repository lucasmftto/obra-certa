version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: obra_certa_db
    environment:
      POSTGRES_DB: obra_certa_db
      POSTGRES_USER: obra_certa_user
      POSTGRES_PASSWORD: obra_certa_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obra_certa_user -d obra_certa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
