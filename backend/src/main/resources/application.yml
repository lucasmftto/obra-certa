spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/obra_certa_db
    username: obra_certa_user
    password: obra_certa_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  cors:
    allowed-origins: "http://localhost:4200,http://192.168.1.141:4200"

logging:
  level:
    com.obracerta: DEBUG
