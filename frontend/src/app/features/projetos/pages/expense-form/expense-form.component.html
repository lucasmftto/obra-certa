<div class="form-container">
  <div class="form-header">
    <button mat-icon-button (click)="voltar()"><mat-icon>arrow_back</mat-icon></button>
    <h1>Registrar gasto</h1>
  </div>
  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="salvar()" class="expense-form">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Categoria</mat-label>
          <mat-select formControlName="categoryId">
            <mat-option [value]="null">Sem categoria</mat-option>
            @for (cat of categories(); track cat.id) {
              <mat-option [value]="cat.id">{{ cat.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <div class="row-fields">
          <mat-form-field appearance="outline">
            <mat-label>Valor *</mat-label>
            <span matTextPrefix>R$&nbsp;</span>
            <input matInput brlMask formControlName="amount" placeholder="0,00" />
            @if (form.get('amount')?.invalid && form.get('amount')?.touched) {
              <mat-error>Valor é obrigatório</mat-error>
            }
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Data do pagamento</mat-label>
            <input matInput [matDatepicker]="dp" formControlName="paidAt" [max]="maxDate" />
            <mat-datepicker-toggle matIconSuffix [for]="dp" />
            <mat-datepicker #dp />
            <mat-hint>Opcional</mat-hint>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Descrição</mat-label>
          <textarea matInput formControlName="description" rows="2"
            placeholder="Ex: Compra de tinta na Leroy (opcional)"></textarea>
        </mat-form-field>

        <div class="form-actions">
          <button type="button" mat-stroked-button (click)="voltar()">Cancelar</button>
          <button type="submit" mat-raised-button color="primary" [disabled]="salvando()">
            Registrar
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
