<div class="form-container">
  <div class="form-header">
    <button mat-icon-button (click)="back()"><mat-icon>arrow_back</mat-icon></button>
    <h1>{{ title() }}</h1>
  </div>
  <mat-card>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="save()" class="item-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Descrição *</mat-label>
          <input matInput formControlName="description" autofocus />
          @if (form.get('description')?.invalid && form.get('description')?.touched) {
            <mat-error>Descrição é obrigatória</mat-error>
          }
        </mat-form-field>

        <div class="row-fields">
          <mat-form-field appearance="outline">
            <mat-label>Quantidade *</mat-label>
            <input matInput type="number" formControlName="quantity" min="0.001" step="0.001" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Unidade *</mat-label>
            <mat-select formControlName="unit">
              @for (u of units; track u) {
                <mat-option [value]="u">{{ u }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </div>

        <div class="row-fields">
          <mat-form-field appearance="outline">
            <mat-label>Preço unitário *</mat-label>
            <span matTextPrefix>R$&nbsp;</span>
            <input matInput brlMask formControlName="unitPrice" placeholder="0,00" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Tipo *</mat-label>
            <mat-select formControlName="type">
              <mat-option value="MATERIAL">Material</mat-option>
              <mat-option value="LABOR">Mão de obra</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="form-actions">
          <button type="button" mat-stroked-button (click)="back()">Cancelar</button>
          <button type="submit" mat-raised-button color="primary" [disabled]="submitting()">
            {{ title() }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
